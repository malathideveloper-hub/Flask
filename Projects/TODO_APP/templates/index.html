
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Todo App</title>
</head>
<body>
    <h1>My Todo App</h1>

    <form action="{{ url_for('add_task') }}" method="POST">
        <input
            type="text"
            name="title"
            placeholder="Enter a task"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    {% if task.completed %}
                        <s>{{ task.title }}</s>
                        <span>Completed</span>
                    {% else %}
                        {{ task.title }}
                    {% endif %}

                    <form
                        action="{{ url_for('complete_task', task_id=task.id) }}"
                        method="POST"
                        style="display: inline;"
                    >
                        <button type="submit">
                            {% if task.completed %}
                                Reopen
                            {% else %}
                                Complete
                            {% endif %}
                        </button>
                    </form>

                    <form
                        action="{{ url_for('delete_task', task_id=task.id) }}"
                        method="POST"
                        style="display: inline;"
                    >
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tasks yet. Add your first task!</p>
    {% endif %}
</body>
</html>
